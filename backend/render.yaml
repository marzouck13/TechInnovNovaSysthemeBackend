# render.yaml
services:
  - type: web
    name: nova-backend
    runtime: python
    plan: free
    branch: main

    #  Indique le dossier où se trouve le code
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

    healthCheckPath: /sante